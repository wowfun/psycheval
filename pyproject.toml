[project]
name = "psycheval"
dynamic = ["version", "readme"]
description = "Agent evaluation, Harbor integration, and trajectory analysis tools"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "src/psycheval/assets/web/vendor/pretty-aui/LICENSE", "src/psycheval/assets/web/vendor/pretty-aui/THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "agent-client-protocol==0.12.1",
    "fastapi>=0.141.1,<0.142",
    "harbor==0.24.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "markdown-it-py>=4.2,<5",
    "pandas>=2.2",
    "pathspec>=1.0,<2",
    # Process-keyed descendant tracking requires birth-aware psutil 7 equality.
    "psutil>=7.2.2,<8",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2,<2",
    "PyYAML>=6.0,<7",
    "tomlkit>=0.15.1,<1",
    "tzlocal>=5.3.1,<6",
    "tzdata>=2026.1",
    "typer>=0.27,<1",
    "uvicorn>=0.52.1,<0.53",
    "XlsxWriter>=3.2,<4",
]

[project.scripts]
peval = "psycheval.cli:main"

[project.urls]
Homepage = "https://github.com/wowfun/psycheval"
Documentation = "https://github.com/wowfun/psycheval/tree/main/docs"
Issues = "https://github.com/wowfun/psycheval/issues"

[build-system]
requires = ["hatchling==1.32.4", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[dependency-groups]
build = ["hatchling==1.32.4", "hatch-fancy-pypi-readme==25.1.0", "twine==7.0.0"]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.version]
path = "src/psycheval/harbor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psycheval"]

[tool.hatch.build.targets.sdist]
only-include = ["src/psycheval", "pyproject.toml", "README.md", "LICENSE", ".gitignore"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]
substitutions = [
    { pattern = '\]\((?![a-zA-Z][a-zA-Z0-9+.-]*:|#|/)([^)]+)\)', replacement = '](https://github.com/wowfun/psycheval/blob/v$HFPR_VERSION/\1)' },
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "README.md" }, { file = "src/psycheval/harbor/__init__.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    ".local",
    ".references",
    "skills",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
