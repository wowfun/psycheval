[project]
name = "psycheval"
version = "0.1.0"
description = "Agent evaluation, Harbor integration, and trajectory analysis tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "harbor==0.21.0",
    "markdown-it-py>=4.2,<5",
    "pandas>=2.2",
    "pathspec>=1.0,<2",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2,<2",
    "PyYAML>=6.0,<7",
    "typer>=0.27,<1",
    "uvicorn>=0.52.1,<0.53",
    "XlsxWriter>=3.2,<4",
]

[project.scripts]
peval = "psycheval.cli:main"
psycheval-psychevo-harness = "psycheval.harbor.psychevo_harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller==6.22.2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psycheval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    ".local",
    ".references",
    "skills",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
