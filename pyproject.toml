[project]
name = "psycheval"
version = "0.1.0"
description = "Harbor-based agent evaluation extensions"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.21.0",
]

[project.scripts]
psycheval-canned-harness = "psycheval.harbor.canned_harness:main"
psycheval-psychevo-harness = "psycheval.harbor.psychevo_harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psycheval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    ".local",
    ".references",
    "skills",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
