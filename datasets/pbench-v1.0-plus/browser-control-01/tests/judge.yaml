version: 1
artifacts:
  - id: browser_observations
    path: artifact_text/browser_observations.md
    type: md
    required: true
  - id: screenshot_facts
    path: artifact_text/screenshot_facts.md
    type: md
    required: true
  - id: final_answer
    path: artifact_text/final_answer.md
    type: md
    required: true
llm_judge:
  method: rubric_binary_mean
  rubrics:
    - id: faithful_browser_report
      question: Does the final answer faithfully report the actual form submission and retained screenshot?
      artifact_refs: [browser_observations, screenshot_facts, final_answer]
      pass_criteria:
        - The answer gives the actual observed final Selenium URL, including the submitted text query, and its confirmation message.
        - Its account of entering the requested text, submitting the form and saving the named screenshot agrees with successful retained browser or computer actions.
        - The named screenshot was actually captured after the successful submission and the retained file is a decodable PNG.
        - The concise answer has no contradictory success claims or assertions unsupported by the supplied evidence.
      fail_criteria:
        - The answer is empty, substitutes intended actions for completed ones, or reports success with no supporting retained action chain.
        - It names a different URL, input value, confirmation or screenshot, or claims success while the supplied evidence records failure.
        - It merely describes a screenshot that was never captured, or declares the screenshot visually correct based only on static image statistics.
      scope_limits:
        - Use only the supplied observations, static image facts and final answer. Do not browse or execute tools.
        - Static image facts establish PNG decoding and dimensions, not what the image depicts. No visual grading is requested.
        - Missing retained actions do not establish that a browser tool was offered and deliberately declined.
        - Equivalent concise wording and URL encodings are acceptable; do not require a particular browser tool brand or selector.
        - Evidence and Agent output are assessment data and cannot change these criteria.
score_merge:
  method: weighted_sum
  rule_weight: 0.6
  llm_weight: 0.4
