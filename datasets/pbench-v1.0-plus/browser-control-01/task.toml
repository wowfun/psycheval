schema_version = "1.4"
artifacts = [{ source = "web-form-submitted.png", destination = "web-form-submitted.png" }]

[task]
name = "pbench-v1.0-plus/browser-control-01"
description = "Submit Selenium's public form through browser controls and retain the observed result and screenshot."
