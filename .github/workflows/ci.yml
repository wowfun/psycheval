name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - &setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          python-version: '3.12'
          # Keep build-only packages out of the shared runtime cache.
          enable-cache: ${{ github.job != 'build-distribution' }}
      - run: uv sync --locked --extra documents
      - name: Install pinned WorkBuddy integration runtime
        run: >-
          uv pip install --python .venv --no-deps
          "workbuddy-bench @ git+https://github.com/Tencent/workbuddy-bench.git@625b2233093ae4f23e76be28c1f341d41cc70373"
      - run: uv pip check --python .venv
      - run: uv run --no-sync pytest
        env:
          PEVAL_WORKBUDDY_RUNTIME_TESTS: "1"

  web-and-source-tool:
    name: Web, docs, and source tool
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - *setup-uv
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python scripts/check_docs.py
      - run: uv run --no-sync python scripts/check_skill.py skills/peval
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: uv tool install -e .
        env:
          UV_TOOL_DIR: .local/source-tool
          UV_TOOL_BIN_DIR: .local/source-tool-bin
      - run: uv run --no-sync python scripts/smoke_source_tool.py .local/source-tool-bin/peval skills/peval

  build-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - *setup-uv
      - run: uv sync --frozen --only-group build
      - run: uv build --no-build-isolation --out-dir .local/distribution-check/dist
      - run: uv run --no-sync twine check --strict .local/distribution-check/dist/*
      - run: uv run --no-sync python scripts/check_distribution.py .local/distribution-check/dist
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project --output-file .local/distribution-check/runtime-constraints.txt
      - run: uv run --no-sync python scripts/prepare_smoke_asset.py .local/distribution-check/echarts.min.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-check
          path: .local/distribution-check/*
          if-no-files-found: error

  distribution:
    needs: build-distribution
    name: Wheel (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - *setup-uv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution-check
          path: .local/distribution-check
      - run: >-
          python scripts/validate_install.py .local/distribution-check/dist/*.whl
          --python "$UV_PYTHON"
          --constraints .local/distribution-check/runtime-constraints.txt
          --echarts .local/distribution-check/echarts.min.js
