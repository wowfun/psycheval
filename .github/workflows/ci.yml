name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web-and-source-tool:
    name: Web, docs, and source tool
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: uv run python scripts/check_docs.py
      - run: >-
          uv run python scripts/check_skill.py
          skills/peval
      - run: >-
          UV_TOOL_DIR=.local/source-tool
          UV_TOOL_BIN_DIR=.local/source-tool-bin
          uv tool install -e . --force
      - run: >-
          uv run python scripts/smoke_source_tool.py
          .local/source-tool-bin/peval
          skills/peval
