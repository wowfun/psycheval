name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  peval-py:
    name: peval-py
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: tools/peval-py/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: tools/peval-py/package-lock.json
      - run: uv sync --project tools/peval-py --frozen
      - run: npm ci
        working-directory: tools/peval-py
      - run: >-
          uv run --project tools/peval-py python -m unittest discover
          -s tools/peval-py/tests
      - run: npm run check
        working-directory: tools/peval-py
