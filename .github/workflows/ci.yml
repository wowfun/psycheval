name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web-and-distribution:
    name: Web, docs, and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run check
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/check_skill.py skills/peval
      - run: uv build --out-dir .local/dist
      - run: >-
          uv run python scripts/check_distribution_assets.py
          .local/dist/psycheval-*.whl
          .local/dist/psycheval-*.tar.gz
      - run: uv venv .local/wheel-env
      - run: >-
          uv pip install --python .local/wheel-env/bin/python
          .local/dist/psycheval-*.whl
      - run: .local/wheel-env/bin/python scripts/smoke_distribution.py
      - run: >-
          uv run pyinstaller --onefile --name peval
          --collect-data psycheval
          --collect-data harbor
          --additional-hooks-dir scripts/pyinstaller_hooks
          --distpath .local/pyinstaller/dist
          --workpath .local/pyinstaller/work
          --specpath .local/pyinstaller
          src/psycheval/cli/__main__.py
      - run: >-
          uv run python scripts/smoke_pyinstaller.py
          .local/pyinstaller/dist/peval
