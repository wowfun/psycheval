name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Install pinned WorkBuddy integration runtime
        run: >-
          uv pip install --no-deps
          "workbuddy-bench @ git+https://github.com/Tencent/workbuddy-bench.git@625b2233093ae4f23e76be28c1f341d41cc70373"
      - run: uv pip check
      - name: Verify native and vendored WorkBuddy integration
        env:
          PEVAL_WORKBUDDY_RUNTIME_TESTS: "1"
        run: >-
          uv run --no-sync pytest tests/harbor/test_workbuddy_verifier.py
          tests/harbor/test_vendoring.py -k 'real_runtime or runtime_writer_redacts or native_prepare_hook'

  web-and-source-tool:
    name: Web, docs, and source tool
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: uv run python scripts/check_docs.py
      - run: >-
          uv run python scripts/check_skill.py
          skills/peval
      - run: >-
          UV_TOOL_DIR=.local/source-tool
          UV_TOOL_BIN_DIR=.local/source-tool-bin
          uv tool install -e . --force
      - run: >-
          uv run python scripts/smoke_source_tool.py
          .local/source-tool-bin/peval
          skills/peval

  build-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen --only-group build
      - run: uv build --no-build-isolation --out-dir .local/distribution-check/dist
      - run: uv run --no-sync twine check --strict .local/distribution-check/dist/*
      - run: uv run --no-sync python scripts/check_distribution.py .local/distribution-check/dist
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project --output-file .local/distribution-check/runtime-constraints.txt
      - run: python scripts/prepare_smoke_asset.py .local/distribution-check/echarts.min.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-check
          path: .local/distribution-check/*
          if-no-files-found: error

  distribution:
    needs: build-distribution
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution-check
          path: .local/distribution-check
      - run: >-
          python scripts/validate_install.py .local/distribution-check/dist/*.whl
          --python '${{ matrix.python }}'
          --constraints .local/distribution-check/runtime-constraints.txt
          --echarts .local/distribution-check/echarts.min.js
