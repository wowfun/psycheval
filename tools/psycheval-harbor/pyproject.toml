[project]
name = "psycheval-harbor"
version = "0.1.0"
description = "Harbor host-process plugins and web-agent evaluation fixtures"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.18.0",
]

[project.scripts]
psycheval-canned-harness = "psycheval_harbor.canned_harness:main"
psycheval-psychevo-harness = "psycheval_harbor.psychevo_harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psycheval_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config", "--strict-markers"]
